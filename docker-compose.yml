---
services:
  s-ui:
    image: alireza7/s-ui
    container_name: s-ui
    hostname: "s-ui"
    volumes:
      - "./db:/app/db"
      - "./cert:/app/cert"
      # Seed nodes file (optional): mount a file with 300+ seed node URIs (one per line)
      # to enable the "Local v2rayN Seed Nodes" subscription. Example:
      # - "./seed/nodes.txt:/app/seed/nodes.txt:ro"
    environment:
      # Set to /app/seed/nodes.txt (matching the volume mount above) to enable Seed.
      # If unset or empty, the Seed provider is disabled.
      # - SUI_SEED_NODES_FILE=/app/seed/nodes.txt
    tty: true
    restart: unless-stopped
    ports:
      - "2095:2095"
      - "2096:2096"
    networks:
      - s-ui
    entrypoint: "./entrypoint.sh"

networks:
  s-ui:
    driver: bridge
  