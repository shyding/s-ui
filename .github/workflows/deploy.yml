name: Deploy to Ubuntu Server
# Trigger redeploy: 2026-09-25 16:36:30

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          cache: false
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
          cd ..
          mkdir -p web/html
          rm -rf web/html/*
          cp -R frontend/dist/* web/html/

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-x86-64-linux-gnu

      - name: Build s-ui for Linux amd64
        run: |
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=amd64
          export CC=x86_64-linux-gnu-gcc

          echo "Building for Linux amd64 with CGO enabled"
          go version

          go build -ldflags="-w -s" -tags "with_quic,with_grpc,with_utls,with_acme,with_gvisor" -o sui main.go
          file sui
          chmod +x sui

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts || true

      - name: Deploy to Ubuntu Server
        run: |
          tar czf payload.tar.gz sui scripts
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=30 -P ${{ secrets.SERVER_PORT }} payload.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/payload.tar.gz

      - name: Restart s-ui service
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=30 -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            # Stop s-ui service and ensure no lingering processes hold ports
            sudo systemctl stop s-ui || true
            sudo pkill -9 -f /usr/local/s-ui/sui || true
            sudo fuser -k 40734/udp 54142/tcp 2096/tcp 2053/tcp || true
            sleep 1

            # Extract payload archive
            tar xzf /tmp/payload.tar.gz -C /tmp/
            rm -f /tmp/payload.tar.gz

            # Backup old binary
            sudo cp /usr/local/s-ui/sui /usr/local/s-ui/sui.backup.$(date +%Y%m%d_%H%M%S) || true

            # Replace with new binary
            sudo mv /tmp/sui /usr/local/s-ui/sui
            sudo chmod +x /usr/local/s-ui/sui

            # Copy scripts and cached logicals
            sudo mkdir -p /usr/local/s-ui/scripts
            sudo cp -rf /tmp/scripts/* /usr/local/s-ui/scripts/
            sudo chmod +x /usr/local/s-ui/scripts/*.py || true

            # Ensure Python3 is available on the server
            if ! command -v python3 &> /dev/null; then
              sudo apt-get update && sudo apt-get install -y python3 python3-pip || true
            fi

            sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true
            sudo modprobe tcp_bbr || true
            sudo sysctl -w net.core.default_qdisc=fq || true
            sudo sysctl -w net.ipv4.tcp_congestion_control=bbr || true
            sudo sysctl -w net.core.rmem_max=16777216 || true
            sudo sysctl -w net.core.wmem_max=16777216 || true
            sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 16777216" || true
            sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 16777216" || true

            # Start s-ui service
            sudo systemctl start s-ui

            # Check status
            sleep 3
            sudo systemctl status s-ui --no-pager

            echo "Deployment completed successfully!"
          ENDSSH
