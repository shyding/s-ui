name: Deploy to Ubuntu Server
# Trigger redeploy: 2026-09-25 16:36:30

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          cache: false
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
          cd ..
          mkdir -p web/html
          rm -rf web/html/*
          cp -R frontend/dist/* web/html/

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-x86-64-linux-gnu

      - name: Build s-ui for Linux amd64
        run: |
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=amd64
          export CC=x86_64-linux-gnu-gcc

          echo "Building for Linux amd64 with CGO enabled"
          go version

          go build -ldflags="-w -s" -tags "with_quic,with_grpc,with_utls,with_acme,with_gvisor" -o sui main.go
          file sui
          chmod +x sui
          sha256sum sui
          # The VPS SSH gateway drops long-running raw scp transfers.  Compress
          # the already-stripped ELF before transfer so deployment is resumable
          # within the gateway timeout; verify/decompress remotely below.
          gzip -1 -c sui > sui.gz
          sha256sum sui.gz

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          timeout 45s ssh-keyscan -p ${{ secrets.SERVER_PORT }} -T 20 ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts || true

      - name: Provision dsy deployment access after OS reinstall
        run: |
          SSH_OPTS="-o BatchMode=yes -o ConnectionAttempts=1 -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=8"
          ssh $SSH_OPTS -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "if ! id dsy >/dev/null 2>&1; then sudo useradd --create-home --shell /bin/bash dsy; fi; sudo usermod -aG sudo dsy; sudo install -d -m 700 -o dsy -g dsy /home/dsy/.ssh; sudo sh -c 'cat /home/${{ secrets.SERVER_USER }}/.ssh/authorized_keys >> /home/dsy/.ssh/authorized_keys'; sudo sh -c 'sort -u /home/dsy/.ssh/authorized_keys -o /home/dsy/.ssh/authorized_keys'; sudo chown dsy:dsy /home/dsy/.ssh/authorized_keys; sudo chmod 600 /home/dsy/.ssh/authorized_keys; echo 'dsy ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/dsy-s-ui >/dev/null; sudo chmod 440 /etc/sudoers.d/dsy-s-ui; if [ -n '${{ secrets.SERVER_PASSWORD }}' ]; then printf '%s\n' 'dsy:${{ secrets.SERVER_PASSWORD }}' | sudo chpasswd; fi; echo dsy-access-ready"

      - name: Transfer artifacts to server
        run: |
          SSH_OPTS="-o BatchMode=yes -o ConnectionAttempts=1 -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=8"
          ssh $SSH_OPTS -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "sudo -n rm -rf /tmp/scripts /tmp/sui /tmp/sui.gz /tmp/s-ui.service"
          ssh $SSH_OPTS -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "sudo -n install -d -o ${{ secrets.SERVER_USER }} -g ${{ secrets.SERVER_USER }} -m 755 /tmp/scripts"
          scp $SSH_OPTS -P ${{ secrets.SERVER_PORT }} sui.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/sui.gz
          ssh $SSH_OPTS -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "gzip -t /tmp/sui.gz && gzip -dc /tmp/sui.gz > /tmp/sui && chmod 755 /tmp/sui && rm -f /tmp/sui.gz"
          scp $SSH_OPTS -P ${{ secrets.SERVER_PORT }} -r scripts ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/scripts
          scp $SSH_OPTS -P ${{ secrets.SERVER_PORT }} s-ui.service ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/s-ui.service

      - name: Bootstrap and start s-ui service
        env:
          SERVER_DOMAIN: ${{ secrets.SERVER_DOMAIN }}
        run: |
          DOMAIN="${SERVER_DOMAIN:-dash.icta.top}"
          ssh -o BatchMode=yes -o ConnectionAttempts=1 -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "BOOTSTRAP_SCRIPT=\$(find /tmp/scripts -name deploy_bootstrap.sh 2>/dev/null | head -n 1); if [ -z \"\$BOOTSTRAP_SCRIPT\" ]; then echo 'deploy_bootstrap.sh not found in /tmp/scripts'; ls -la /tmp/scripts; exit 1; fi; chmod +x \"\$BOOTSTRAP_SCRIPT\"; sudo bash \"\$BOOTSTRAP_SCRIPT\" '$DOMAIN'"
